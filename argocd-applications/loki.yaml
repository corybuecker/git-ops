apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    path: loki
    repoURL: https://github.com/corybuecker/git-ops.git
    targetRevision: HEAD
  destination:
    namespace: loki
    server: https://kubernetes.default.svc