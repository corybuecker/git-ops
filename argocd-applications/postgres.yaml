apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    path: postgres
    repoURL: https://github.com/corybuecker/git-ops.git
    targetRevision: HEAD
  destination:
    namespace: postgres
    server: https://kubernetes.default.svc