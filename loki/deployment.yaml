apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      serviceAccountName: loki
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        readOnlyRootFilesystem: true
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          command:
            - /usr/bin/loki
            - -config.file=/etc/loki/config/loki.yaml
            - -use-thanos-objstore=true
            - -config.expand-env=true
          volumeMounts:
            - name: data
              mountPath: /loki
            - name: config
              mountPath: /etc/loki/config
              readOnly: true
          imagePullPolicy: IfNotPresent
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loki
        - name: config
          configMap:
            name: loki