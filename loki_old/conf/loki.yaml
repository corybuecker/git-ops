auth_enabled: false

common:
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1

storage_config:
  use_thanos_objstore: true
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  object_store:
    s3:
      bucket_name: loki-{{ .Values.aws.accountId }}-us-east-1-an
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
