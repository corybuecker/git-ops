# -- Not part of upstream Longhorn chart. AWS account ID used to build the IAM
# role ARN below. This is not committed with a real value; override it in a
# gitignored values.secret.yaml (see values.secret.example.yaml).
aws:
  accountId: "000000000000"
serviceAccount:
  # -- Not part of upstream Longhorn chart. Name of the IAM role (combined
  # with aws.accountId) to assume via IRSA.
  roleName: "LonghornBackups"
  # -- Annotations to add to the service account
  annotations:
    eks.amazonaws.com/audience: "sts.amazonaws.com"
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "600"
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/LonghornBackups"